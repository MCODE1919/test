<!doctype html>
<html lang="ms">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Mainkan video ujian lima saat terus dalam browser.">
    <title>Video ujian — Tekan Play</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #101827; color: #f4f7fb; font-family: system-ui, sans-serif; }
      main { width: min(100%, 960px); }
      h1 { font-size: clamp(1.8rem, 5vw, 3rem); margin: 0 0 12px; }
      p { color: #bdc9dc; line-height: 1.6; }
      video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #101827; border: 1px solid #384860; border-radius: 12px; margin-top: 24px; }
      #status { min-height: 1.6em; }
      a { color: #67efc8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Video ujian</h1>
      <p>Tekan Play untuk menonton terus di sini. Video ini tanpa audio.</p>
      <video id="player" controls playsinline preload="metadata" poster="poster.jpg" aria-label="Video ujian teks dan bentuk bergerak selama lima saat">
        <source src="test-video.mp4" type="video/mp4">
        Browser ini tidak menyokong player video. <a href="test-video.mp4">Buka video</a>.
      </video>
      <p id="status" role="status">5 saat · 720p · Tanpa audio</p>
      <p><a href="../">Kembali ke laman utama</a></p>
    </main>
    <script>
      const player = document.getElementById('player');
      const status = document.getElementById('status');
      player.addEventListener('playing', () => { status.textContent = 'Sedang dimainkan · Tanpa audio'; });
      player.addEventListener('ended', () => { status.textContent = 'Video selesai. Tekan Play untuk menonton semula.'; });
      player.addEventListener('error', () => { status.textContent = 'Video gagal dimuatkan. Cuba muat semula halaman atau gunakan browser lain.'; });
      player.querySelector('source').addEventListener('error', () => { status.textContent = 'Fail video tidak dapat dimuatkan. Cuba muat semula halaman.'; });
    </script>
  </body>
</html>
